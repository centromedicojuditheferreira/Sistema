<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guias da Agenda · Centro Médico Judithe Ferreira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#12332F;        /* verde-petróleo do papel timbrado */
    --tinta-2:#33524D;
    --papel:#F4F7F5;        /* branco clínico esverdeado */
    --cartao:#FFFFFF;
    --linha:#DCE5E1;
    --ok:#0B7A5C;           /* coberto / ações */
    --ok-fundo:#E4F2EC;
    --alerta:#A85E08;
    --alerta-fundo:#FBEEDC;
    --critico:#B3362A;
    --critico-fundo:#FBE7E4;
    --info:#3B6E8F;
    --info-fundo:#E6EFF5;
    --neutro:#6B7A76;
    --sombra:0 1px 2px rgba(18,51,47,.06), 0 4px 14px rgba(18,51,47,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Public Sans',system-ui,sans-serif;
    background:var(--papel);color:var(--tinta);
    font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace}

  /* ── cabeçalho ── */
  header{
    background:var(--tinta);color:#F2F6F4;
    padding:14px 20px 0;
    position:sticky;top:0;z-index:20;
    box-shadow:0 2px 10px rgba(18,51,47,.25);
  }
  .topo{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.3px}
  h1 small{font-family:'Public Sans';font-weight:500;font-size:12px;opacity:.7;letter-spacing:.4px;text-transform:uppercase;display:block;margin-top:1px}
  .topo-dir{margin-left:auto;display:flex;align-items:center;gap:10px}
  .atualizado{font-size:12px;opacity:.75}
  .btn{
    font:600 13px 'Public Sans';border:0;border-radius:8px;cursor:pointer;
    padding:8px 13px;background:rgba(255,255,255,.14);color:#fff;transition:background .15s;
  }
  .btn:hover{background:rgba(255,255,255,.24)}
  .btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #7FD1B9;outline-offset:2px}
  .busca{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    border-radius:8px;color:#fff;padding:8px 12px;font:500 13px 'Public Sans';width:210px;
  }
  .busca::placeholder{color:rgba(255,255,255,.55)}

  /* ── régua dos dias (assinatura da página) ── */
  .regua{
    display:flex;gap:8px;overflow-x:auto;padding:14px 0 14px;
    max-width:1180px;margin:0 auto;scrollbar-width:thin;
  }
  .dia{
    flex:0 0 auto;min-width:86px;text-align:center;cursor:pointer;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
    border-radius:10px;padding:8px 10px 9px;color:#EAF1EE;position:relative;
    transition:background .15s,border-color .15s;
  }
  .dia:hover{background:rgba(255,255,255,.16)}
  .dia.ativo{background:#F2F6F4;color:var(--tinta);border-color:#F2F6F4}
  .dia .dsem{font:700 11px 'Archivo';text-transform:uppercase;letter-spacing:.8px;opacity:.8}
  .dia .dnum{font:800 19px 'Archivo';letter-spacing:-.5px;margin-top:1px}
  .dia .badge{
    position:absolute;top:-7px;right:-6px;min-width:20px;height:20px;border-radius:10px;
    background:var(--critico);color:#fff;font:700 11px/20px 'Archivo';padding:0 5px;
  }
  .dia .badge.zero{background:var(--ok)}
  .dia.feriado .dsem::after{content:" ✦"}

  /* ── fila de reconferência (🔁 Renovações) ── */
  .btn{position:relative}
  .btn .nbadge{
    position:absolute;top:-7px;right:-6px;min-width:19px;height:19px;border-radius:10px;
    background:var(--critico);color:#fff;font:700 11px/19px 'Archivo';padding:0 5px;
  }
  .fila-topo{
    background:var(--cartao);border:1px solid var(--linha);border-radius:12px;
    box-shadow:var(--sombra);padding:16px 16px 14px;margin-bottom:18px;
  }
  .fila-topo h2{font:800 17px 'Archivo';letter-spacing:-.3px;margin-bottom:4px}
  .fila-topo p{font-size:12.5px;color:var(--neutro);margin-bottom:12px;max-width:660px}
  .fila-form{display:flex;gap:8px;flex-wrap:wrap}
  .fila-form input{
    flex:1;min-width:190px;font:600 15px 'IBM Plex Mono';padding:10px 12px;
    border:1.5px solid var(--linha);border-radius:8px;background:#fff;color:var(--tinta);
  }
  .fila-form .btn{background:var(--ok);padding:10px 16px}
  .fila-form .btn:hover{background:#08624a}
  .fila-aviso{display:none;margin-top:10px;font:600 12.5px 'Public Sans';border-radius:8px;padding:8px 11px}
  .fcard{
    background:var(--cartao);border:1px solid var(--linha);border-left:5px solid var(--neutro);
    border-radius:10px;box-shadow:var(--sombra);padding:11px 14px;margin-bottom:9px;
    display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;
  }
  .fcard.g0{border-left-color:var(--critico)}
  .fcard.g1{border-left-color:var(--alerta)}
  .fcard.g2{border-left-color:var(--ok)}
  .fcard.ginfo{border-left-color:var(--info)}
  .fcard .fnum{font:700 15px 'IBM Plex Mono'}
  .fcard .fpac{font-family:'Public Sans';font-weight:700}
  .fcard .fmeta{font-size:12px;color:var(--neutro);margin-top:2px}
  .fcard .fsit{margin-top:7px}
  .fcard .fdet{font-size:12.5px;color:var(--tinta-2);margin-top:6px;line-height:1.5;max-width:660px}
  .fx{
    width:30px;height:30px;border:1px solid var(--linha);border-radius:8px;background:var(--papel);
    font:700 14px 'Archivo';color:var(--neutro);cursor:pointer;transition:all .15s;
  }
  .fx:hover{color:var(--critico);border-color:var(--critico)}
  .fespera{font:700 16px 'Archivo';color:var(--neutro)}

  main{max-width:1180px;margin:0 auto;padding:16px 20px 80px}

  /* ── filtros por situação ── */
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{
    border:1.5px solid var(--linha);background:var(--cartao);border-radius:999px;
    padding:6px 13px;font:600 12.5px 'Public Sans';color:var(--tinta-2);cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:all .15s;
  }
  .chip b{font-family:'Archivo';font-size:12px}
  .chip:hover{border-color:var(--tinta-2)}
  .chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .chip .ponto{width:9px;height:9px;border-radius:50%}

  /* ── grupos por dia ── */
  .grupo{margin-bottom:26px}
  .grupo h2{
    font:800 15px 'Archivo';letter-spacing:-.2px;text-transform:uppercase;
    color:var(--tinta-2);display:flex;align-items:baseline;gap:10px;margin-bottom:9px;
  }
  .grupo h2 .cont{font:600 12px 'Public Sans';color:var(--neutro);text-transform:none;letter-spacing:0}

  /* ── linha de consulta ── */
  .card{
    background:var(--cartao);border:1px solid var(--linha);border-left:5px solid var(--neutro);
    border-radius:10px;box-shadow:var(--sombra);
    padding:11px 14px;margin-bottom:9px;
    display:grid;grid-template-columns:52px 1fr auto;gap:4px 14px;align-items:start;
  }
  .card.g0{border-left-color:var(--critico)}
  .card.g1{border-left-color:var(--alerta)}
  .card.g2{border-left-color:var(--ok)}
  .card.ginfo{border-left-color:var(--info)}
  .card.tratada{opacity:.55}
  .card.tratada .paciente{text-decoration:line-through}
  .hora{font:800 17px 'Archivo';letter-spacing:-.3px;padding-top:2px}
  .quem .paciente{font-weight:700;font-size:15px}
  .quem .meta{font-size:12.5px;color:var(--neutro);margin-top:1px}
  .quem .meta .esp{font-weight:600;color:var(--tinta-2)}
  .sit{justify-self:end;text-align:right;min-width:210px}
  .sit .rotulo{
    display:inline-flex;align-items:center;gap:6px;border-radius:7px;
    font:700 12px 'Public Sans';padding:4px 9px;letter-spacing:.2px;
  }
  .s0 .rotulo{background:var(--critico-fundo);color:var(--critico)}
  .s1 .rotulo{background:var(--alerta-fundo);color:var(--alerta)}
  .s2 .rotulo{background:var(--ok-fundo);color:var(--ok)}
  .sinfo .rotulo{background:var(--info-fundo);color:var(--info)}
  .sit .detalhe{font-size:12px;color:var(--neutro);margin-top:4px;max-width:280px}
  .sit .detalhe .mono{font-size:11.5px}

  /* ── rodapé do card: contato + tratamento ── */
  .acoes{
    grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    border-top:1px dashed var(--linha);margin-top:8px;padding-top:8px;
  }
  .fone{
    display:inline-flex;align-items:center;gap:6px;font:600 12.5px 'IBM Plex Mono';
    background:var(--papel);border:1px solid var(--linha);border-radius:7px;
    padding:5px 9px;color:var(--tinta-2);text-decoration:none;cursor:pointer;
  }
  .fone:hover{border-color:var(--ok);color:var(--ok)}
  .acoes select{
    font:600 12.5px 'Public Sans';padding:6px 8px;border:1.5px solid var(--linha);
    border-radius:7px;background:#fff;color:var(--tinta);cursor:pointer;
  }
  .acoes select.trat-guia_solicitada{border-color:var(--alerta);background:var(--alerta-fundo)}
  .acoes select.trat-resolvido,.acoes select.trat-desmarcado{border-color:var(--ok);background:var(--ok-fundo)}
  .acoes input.nota{
    flex:1;min-width:160px;font:500 12.5px 'Public Sans';padding:6px 9px;
    border:1.5px solid var(--linha);border-radius:7px;
  }
  .salvo{font:600 11px 'Public Sans';color:var(--ok);opacity:0;transition:opacity .2s}
  .salvo.mostra{opacity:1}
  .autora-tag{font-size:11px;color:var(--neutro)}

  /* ── estados ── */
  .vazio,.erro,.carregando{
    background:var(--cartao);border:1px dashed var(--linha);border-radius:12px;
    padding:34px;text-align:center;color:var(--neutro);font-size:14px;
  }
  .erro{border-color:var(--critico);color:var(--critico)}
  .vazio b{font:800 17px 'Archivo';color:var(--ok);display:block;margin-bottom:6px}

  /* ── setup (primeira vez) ── */
  .setup{
    max-width:520px;margin:60px auto;background:var(--cartao);border:1px solid var(--linha);
    border-radius:14px;box-shadow:var(--sombra);padding:28px;
  }
  .setup h2{font:800 19px 'Archivo';margin-bottom:4px}
  .setup p{font-size:13px;color:var(--neutro);margin-bottom:16px}
  .setup label{font:700 12px 'Public Sans';text-transform:uppercase;letter-spacing:.5px;color:var(--tinta-2);display:block;margin:12px 0 4px}
  .setup input,.setup select{width:100%;padding:10px 12px;border:1.5px solid var(--linha);border-radius:8px;font:500 13px 'IBM Plex Mono';background:#fff;color:var(--tinta)}
  .setup select{font-family:'Public Sans';font-weight:600;cursor:pointer}
  .login-erro{background:var(--critico-fundo);color:var(--critico);border-radius:8px;padding:9px 12px;font:600 12.5px 'Public Sans';margin-top:12px}
  .quem-sou{font:700 12px 'Public Sans';background:rgba(255,255,255,.16);border-radius:999px;padding:5px 11px}
  .setup .btn{background:var(--ok);margin-top:18px;width:100%;padding:11px}
  .setup .btn:hover{background:#08624a}

  /* ── visão do dono ── */
  .adm-titulo{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
  .adm-titulo h2{font:800 19px 'Archivo';letter-spacing:-.3px}
  .adm-titulo .btn{background:var(--tinta);color:#fff}
  .adm-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
  .adm-card{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;box-shadow:var(--sombra);padding:12px 14px}
  .adm-card .num{font:800 26px 'Archivo';letter-spacing:-.5px}
  .adm-card .rot{font:600 11.5px 'Public Sans';text-transform:uppercase;letter-spacing:.4px;color:var(--neutro);margin-top:2px}
  .adm-card.vermelho .num{color:var(--critico)}
  .adm-card.ambar .num{color:var(--alerta)}
  .adm-card.verde .num{color:var(--ok)}
  .adm-sec{margin:22px 0 8px;font:800 14px 'Archivo';text-transform:uppercase;letter-spacing:.3px;color:var(--tinta-2)}
  .adm-sec small{font:500 12px 'Public Sans';text-transform:none;letter-spacing:0;color:var(--neutro)}
  table.adm{width:100%;border-collapse:collapse;background:var(--cartao);border:1px solid var(--linha);border-radius:10px;overflow:hidden;box-shadow:var(--sombra);font-size:13px}
  table.adm th{font:700 11.5px 'Public Sans';text-transform:uppercase;letter-spacing:.4px;text-align:left;color:var(--neutro);background:var(--papel);padding:8px 10px;border-bottom:1px solid var(--linha)}
  table.adm td{padding:8px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
  table.adm tr:last-child td{border-bottom:0}
  .tag-sit{display:inline-block;border-radius:6px;font:700 11px 'Public Sans';padding:2px 7px}
  .tag-s0{background:var(--critico-fundo);color:var(--critico)}
  .tag-s1{background:var(--alerta-fundo);color:var(--alerta)}
  .adm-vazio{background:var(--ok-fundo);color:var(--ok);border-radius:10px;padding:14px;font-weight:600;font-size:13.5px}

  @media (max-width:720px){
    .card{grid-template-columns:46px 1fr}
    .sit{grid-column:1 / -1;justify-self:start;text-align:left;margin-top:2px}
    .busca{width:130px}
    h1{font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header id="cabecalho" hidden>
  <div class="topo">
    <h1>Guias da Agenda<small>Centro Médico Judithe Ferreira · Unimed</small></h1>
    <div class="topo-dir">
      <input class="busca" id="busca" type="search" placeholder="Buscar paciente…" aria-label="Buscar paciente">
      <span class="atualizado" id="atualizado">—</span>
      <span class="quem-sou" id="quemSou"></span>
      <button class="btn" id="btnAtualizar" title="Recarregar do banco">↻ Atualizar</button>
      <button class="btn" id="btnFila" title="Guias que a Unimed renovou — reconferir no SGU">🔁 Renovações<span class="nbadge" id="filaBadge" hidden>0</span></button>
      <button class="btn" id="btnAdmin" title="Relatórios do dono">👑 Dono</button>
      <button class="btn" id="btnSair" title="Sair">Sair</button>
    </div>
  </div>
  <div class="regua" id="regua" role="tablist" aria-label="Dias"></div>
</header>

<main id="conteudo"></main>

<script>
/* ═════════════════════════════════════════════════════════════════════
   CONFIGURAÇÃO — cole aqui antes de publicar no GitHub Pages.
   (Se deixar vazio, o painel pede na primeira abertura e tenta lembrar.)
   ═════════════════════════════════════════════════════════════════════ */
/* ═════════════════════════════════════════════════════════════════════
   1) CONEXÃO — preencha as duas linhas abaixo ANTES de publicar.
      Assim as secretárias nunca veem nada de banco: só o login.
   ═════════════════════════════════════════════════════════════════════ */
var SUPABASE_URL = "https://xcucoryngkkuszztpxyq.supabase.co";
var SUPABASE_KEY = "sb_publishable_6ATQUvqBBRS5xx7jAYKlmw_2FwTuHG7";

/* ═════════════════════════════════════════════════════════════════════
   2) QUEM ENTRA — uma linha por pessoa. Quem tem dono:true enxerga o
      botão 👑 Visão do dono. SEM SENHA por enquanto: é só escolher o
      nome. Pra cobrar senha de alguém no futuro, acrescente o campo:
        { nome: "Marina", senha: "minhasenha" }
      (Isto é controle da TELA, não do banco — o endurecimento de
       verdade continua sendo a pendência B10.)
   ═════════════════════════════════════════════════════════════════════ */
var USUARIOS = [
  { nome: "Gabriel",  dono: true },
  { nome: "Marina"  },
  { nome: "Paula"   },
  { nome: "Recepção" }
];

/* ── memória local à prova de ambiente sem localStorage ── */
function lembrar(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lembrado(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function esquecer(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* Se por algum motivo a chave não foi preenchida acima, tenta herdar a
   conexão já salva pelo painel-supabase.html neste mesmo navegador. */
function herdarConexaoAntiga(){
  try {
    var c = JSON.parse(localStorage.getItem("sbpanel:conn") || "null");
    if (c && c.url && c.key) return { url: String(c.url).replace(/\/+$/,""), key: c.key };
  } catch(e) {}
  return null;
}
var chaveOk = SUPABASE_KEY && SUPABASE_KEY.indexOf("COLE_AQUI") < 0;
var herdada = chaveOk ? null : herdarConexaoAntiga();

var CFG = {
  url: (chaveOk ? SUPABASE_URL : (herdada ? herdada.url : SUPABASE_URL)).replace(/\/+$/,""),
  key: (chaveOk ? SUPABASE_KEY : (herdada ? herdada.key : "")),
  autora: lembrado("pga_autora"),
  dono: lembrado("pga_dono") === "1"
};

/* ── dicionário das situações (voz da recepção) ── */
var SIT = {
  sem_guia:            {rot:"Sem guia",           cls:"s0", g:"g0", acao:"🚫 REGRA DA CASA: consulta não pode estar na agenda sem guia. Solicitar guia AGORA — ou desmarcar."},
  guia_vencida:        {rot:"Guia vencida",       cls:"s0", g:"g0", acao:"🚫 Guia vencida sai da agenda. Falar com a Unimed pra ATUALIZAR A VALIDADE (ou guia nova) AGORA — ou desmarcar."},
  saldo_esgotado:      {rot:"Saldo esgotado",     cls:"s0", g:"g0", acao:"🚫 Sem sessão sobrando = sem guia. Solicitar renovação AGORA — ou desmarcar."},
  sem_carteirinha:     {rot:"Sem carteirinha",    cls:"s0", g:"g0", acao:"Completar o cadastro do paciente HOJE — sem carteirinha nem dá pra casar guia."},
  sem_saldo_na_fila:   {rot:"Fila passa do saldo",cls:"s1", g:"g1", acao:"Solicitar guia nova ANTES desta data — a fila do paciente consome o saldo antes de chegar aqui."},
  guia_ainda_nao_vale: {rot:"Guia só vale depois",cls:"s1", g:"g1", acao:"Conferir a data de autorização com a Unimed."},
  sessao_em_feriado:   {rot:"Cai no feriado",     cls:"sinfo", g:"ginfo", acao:"Remarcar — o sistema não fatura sessão em feriado."},
  coberto:             {rot:"Coberta",            cls:"s2", g:"g2", acao:""}
};
var TRATAMENTOS = [
  ["pendente","Pendente"],
  ["guia_solicitada","Guia solicitada"],
  ["resolvido","Resolvido"],
  ["sem_solucao","Sem solução"],
  ["desmarcado","Desmarcado"]
];
var DSEM = ["dom","seg","ter","qua","qui","sex","sáb"];

/* ── fila de reconferência (voz da recepção) ── */
var SIT_FILA = {
  aguardando:    {rot:"Na fila do robô",            cls:"sinfo", g:"ginfo"},
  conferindo:    {rot:"Robô no SGU agora…",         cls:"sinfo", g:"ginfo"},
  renovada:      {rot:"Validade atualizada ✔",      cls:"s2",    g:"g2"},
  sem_mudanca:   {rot:"SGU ainda com a data velha", cls:"s1",    g:"g1"},
  fora_do_banco: {rot:"Guia fora do nosso banco",   cls:"sinfo", g:"ginfo"},
  erro:          {rot:"Erro ao conferir",           cls:"s0",    g:"g0"}
};
var FILA_FINAIS = ["renovada","sem_mudanca","fora_do_banco","erro"];

var estado = { linhas: [], filtroDia: null, filtroSit: "pendencias", busca: "",
               tela: "agenda", fila: null, filaErro: "", filaDraft: "", _filaJson: "" };

/* ═══ REST helpers ═══ */
function cab(extra){
  var h = { "apikey": CFG.key, "Authorization": "Bearer " + CFG.key };
  for (var k in (extra||{})) h[k] = extra[k];
  return h;
}
function carregar(){
  var main = document.getElementById("conteudo");
  if(estado.tela !== "fila") main.innerHTML = '<div class="carregando">Buscando a agenda no banco…</div>';
  fetch(CFG.url + "/rest/v1/pre_agenda_cobertura?select=*", { headers: cab() })
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status + " — confira URL/key e se o 08_SQL_PRE_E_CONF.sql já rodou.");
      return r.json();
    })
    .then(function(dados){
      estado.linhas = dados;
      var tela = new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      var regua = (dados[0] && dados[0].calculado_em)
        ? new Date(dados[0].calculado_em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
        : null;
      document.getElementById("atualizado").textContent =
        regua ? ("régua das " + regua + " · tela " + tela) : ("atualizado às " + tela);
      desenhar();
    })
    .catch(function(e){
      if(estado.tela === "fila") return;
      main.innerHTML = '<div class="erro">Não consegui ler a view <span class="mono">pre_agenda_cobertura</span>.<br>' +
        escapa(e.message) + '</div>';
    });
}
function salvarNota(agid, tratamento, nota, aoSalvar){
  var corpo = [{ agendamento_id: agid, tratamento: tratamento, nota: nota || null, autora: CFG.autora || null }];
  fetch(CFG.url + "/rest/v1/pre_agenda_notas?on_conflict=agendamento_id", {
    method: "POST",
    headers: cab({ "Content-Type": "application/json",
                   "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(corpo)
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    var l = estado.linhas.find(function(x){ return x.agendamento_id === agid; });
    if(l){ l.tratamento = tratamento; l.nota = nota; l.autora_nota = CFG.autora; }
    aoSalvar(true);
  }).catch(function(){ aoSalvar(false); });
}

/* ═══ fila de reconferência: REST ═══ */
function carregarFila(){
  fetch(CFG.url + "/rest/v1/pre_guias_reconferir?select=*&dispensada_em=is.null&order=criado_em.desc&limit=80", { headers: cab() })
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status + " — o 09_SQL_FILA_RECONFERENCIA.sql já rodou?");
      return r.json();
    })
    .then(function(dados){
      var json = JSON.stringify(dados);
      var mudou = json !== estado._filaJson;
      estado._filaJson = json;
      estado.fila = dados; estado.filaErro = "";
      atualizarBadgeFila();
      if(estado.tela === "fila" && mudou) desenharFila();
    })
    .catch(function(e){
      estado.filaErro = e.message;
      if(estado.fila === null) estado.fila = [];
      atualizarBadgeFila();
      if(estado.tela === "fila") desenharFila();
    });
}
function enviarFila(){
  var campo = document.getElementById("filaNum");
  if(!campo) return;
  var num = (campo.value || "").replace(/\D/g, "");
  if(num.length < 6){ avisoFila("Número esquisito — a guia tem só números (ex.: 16337779).", true); return; }
  var vivo = (estado.fila || []).some(function(l){
    return l.numero_guia === num && (l.situacao === "aguardando" || l.situacao === "conferindo");
  });
  if(vivo){ avisoFila("Essa guia já está na fila — o robô já vai olhar.", true); return; }
  fetch(CFG.url + "/rest/v1/pre_guias_reconferir", {
    method: "POST",
    headers: cab({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
    body: JSON.stringify([{ numero_guia: num, autora: CFG.autora || null }])
  }).then(function(r){
    if(r.status === 409){ avisoFila("Essa guia já está na fila — o robô já vai olhar.", true); return; }
    if(!r.ok) throw new Error("HTTP " + r.status);
    campo.value = ""; estado.filaDraft = "";
    avisoFila("Mandei pro robô ✔ O resultado aparece aqui embaixo em instantes.", false);
    carregarFila();
  }).catch(function(e){
    avisoFila("Não consegui mandar (" + e.message + ")", true);
  });
}
function dispensarFila(id){
  fetch(CFG.url + "/rest/v1/pre_guias_reconferir?id=eq." + id, {
    method: "PATCH",
    headers: cab({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
    body: JSON.stringify({ dispensada_em: new Date().toISOString(), dispensada_por: CFG.autora || null })
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    estado.fila = (estado.fila || []).filter(function(l){ return l.id !== id; });
    estado._filaJson = JSON.stringify(estado.fila);
    atualizarBadgeFila();
    if(estado.tela === "fila") desenharFila();
  }).catch(function(){ avisoFila("Não consegui dispensar — tente de novo.", true); });
}
function avisoFila(msg, ehErro){
  var el = document.getElementById("filaAviso");
  if(!el) return;
  el.textContent = msg;
  el.style.display = "block";
  el.style.background = ehErro ? "var(--critico-fundo)" : "var(--ok-fundo)";
  el.style.color = ehErro ? "var(--critico)" : "var(--ok)";
  if(!ehErro){ setTimeout(function(){ el.style.display = "none"; }, 6000); }
}
function fmtQuando(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) + " " +
         d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function atualizarBadgeFila(){
  var b = document.getElementById("filaBadge");
  if(!b) return;
  var prontos = (estado.fila || []).filter(function(l){ return FILA_FINAIS.indexOf(l.situacao) >= 0; }).length;
  b.hidden = !prontos;
  b.textContent = prontos;
}
function ligarPollFila(){ if(!window._pgaFilaTimer) window._pgaFilaTimer = setInterval(carregarFila, 20*1000); }
function desligarPollFila(){ if(window._pgaFilaTimer){ clearInterval(window._pgaFilaTimer); window._pgaFilaTimer = null; } }

/* ═══ utilidades ═══ */
function escapa(s){ var d=document.createElement("div"); d.textContent=(s==null?"":String(s)); return d.innerHTML; }
function ehPendencia(l){
  var tratada = l.tratamento === "resolvido" || l.tratamento === "desmarcado";
  return l.situacao !== "coberto" && !tratada;
}
function primeiroCelular(cel, tel){
  var campos = [cel, tel];
  for (var i=0;i<campos.length;i++){
    if(!campos[i]) continue;
    var partes = String(campos[i]).split("/");
    for (var j=0;j<partes.length;j++){
      var d = partes[j].replace(/\D/g,"");
      if(d.slice(0,2)==="55" && (d.length===12||d.length===13)) d = d.slice(2);
      if(d.length===11 && d[2]==="9") return "55"+d;
      if(d.length===10 && "6789".indexOf(d[2])>=0) return "55"+d;
    }
  }
  return "";
}
function foneBonito(n){ // 5562999990001 → (62) 99999-0001
  var d = n.slice(2), ddd = d.slice(0,2), resto = d.slice(2);
  return "("+ddd+") "+resto.slice(0, resto.length-4)+"-"+resto.slice(-4);
}

/* ═══ desenho ═══ */
function desenhar(){
  if(estado.tela === "fila"){ desenharFila(); return; }
  desenharRegua();
  desenharFiltros();
  desenharLista();
}
function diasUnicos(){
  var m = {};
  estado.linhas.forEach(function(l){
    if(!m[l.data]) m[l.data] = { data:l.data, dia_semana:l.dia_semana, data_fmt:l.data_fmt, pend:0, feriado:false };
    if(ehPendencia(l)) m[l.data].pend++;
    if(l.em_feriado) m[l.data].feriado = true;
  });
  return Object.keys(m).sort().map(function(k){ return m[k]; });
}
function desenharRegua(){
  var r = document.getElementById("regua"); r.innerHTML = "";
  var tudo = document.createElement("button");
  tudo.className = "dia" + (estado.filtroDia===null ? " ativo" : "");
  tudo.innerHTML = '<div class="dsem">todos</div><div class="dnum">'+diasUnicos().length+'d</div>';
  var totalPend = estado.linhas.filter(ehPendencia).length;
  tudo.innerHTML += '<div class="badge'+(totalPend?"":" zero")+'">'+totalPend+'</div>';
  tudo.onclick = function(){ estado.tela = "agenda"; desligarPollFila(); estado.filtroDia = null; desenhar(); };
  r.appendChild(tudo);
  diasUnicos().forEach(function(d){
    var b = document.createElement("button");
    b.className = "dia" + (estado.filtroDia===d.data ? " ativo" : "") + (d.feriado ? " feriado" : "");
    b.setAttribute("role","tab");
    b.innerHTML = '<div class="dsem">'+escapa(d.dia_semana.slice(0,3))+'</div>' +
                  '<div class="dnum">'+escapa(d.data_fmt)+'</div>' +
                  '<div class="badge'+(d.pend?"":" zero")+'">'+d.pend+'</div>';
    b.onclick = function(){ estado.tela = "agenda"; desligarPollFila(); estado.filtroDia = (estado.filtroDia===d.data ? null : d.data); desenhar(); };
    r.appendChild(b);
  });
}
function desenharFiltros(){
  var alvo = { pendencias:0, tratadas:0, cobertas:0 };
  estado.linhas.forEach(function(l){
    if(ehPendencia(l)) alvo.pendencias++;
    else if(l.situacao==="coberto") alvo.cobertas++;
    else alvo.tratadas++;
  });
  var defs = [
    ["pendencias","Pendências", "var(--critico)", alvo.pendencias],
    ["tratadas","Já tratadas", "var(--alerta)", alvo.tratadas],
    ["cobertas","Cobertas", "var(--ok)", alvo.cobertas],
    ["tudo","Tudo", "var(--neutro)", estado.linhas.length]
  ];
  var f = document.createElement("div"); f.className = "filtros";
  defs.forEach(function(d){
    var c = document.createElement("button");
    c.className = "chip" + (estado.filtroSit===d[0] ? " on" : "");
    c.innerHTML = '<span class="ponto" style="background:'+d[2]+'"></span>'+d[1]+' <b>'+d[3]+'</b>';
    c.onclick = function(){ estado.filtroSit = d[0]; desenhar(); };
    f.appendChild(c);
  });
  var main = document.getElementById("conteudo");
  main.innerHTML = ""; main.appendChild(f);
}
function passaFiltro(l){
  if(estado.filtroDia && l.data !== estado.filtroDia) return false;
  if(estado.busca && (l.paciente||"").toLowerCase().indexOf(estado.busca) < 0) return false;
  var tratada = l.tratamento==="resolvido" || l.tratamento==="desmarcado";
  if(estado.filtroSit==="pendencias") return ehPendencia(l);
  if(estado.filtroSit==="tratadas")  return l.situacao!=="coberto" && (tratada || (l.tratamento && l.tratamento!=="pendente"));
  if(estado.filtroSit==="cobertas")  return l.situacao==="coberto";
  return true;
}
function detalheDe(l){
  var m = [];
  if(l.situacao==="coberto")
    m.push('guia <span class="mono">'+escapa(l.numero_guia)+'</span> · '+l.saldo_guia+' sessão(ões) · vence '+escapa(l.guia_fim_fmt));
  if(l.situacao==="guia_vencida")
    m.push('última guia <span class="mono">'+escapa(l.numero_guia||"—")+'</span> venceu em '+escapa(l.guia_fim_fmt||"—")+
           (typeof l.dias_para_vencer==="number" ? ' <b>(há '+Math.abs(l.dias_para_vencer)+' dia'+(Math.abs(l.dias_para_vencer)===1?'':'s')+')</b>' : ''));
  if(l.situacao==="saldo_esgotado")
    m.push('guia <span class="mono">'+escapa(l.numero_guia)+'</span> vale até '+escapa(l.guia_fim_fmt)+', mas zerou');
  if(l.situacao==="sem_saldo_na_fila")
    m.push('é a '+l.posicao_efetiva+'ª consulta dele(a) e o saldo na data é '+l.saldo_na_data);
  if(l.situacao==="guia_ainda_nao_vale" && l.guia_inicio)
    m.push('guia autorizada só a partir de '+escapa(String(l.guia_inicio).split("-").reverse().join("/")));
  if(l.situacao==="sem_guia" && l.numero_guia)
    m.push('(há guia de outra terapia — conferir)');
  var meta = SIT[l.situacao] || {};
  if(meta.acao && l.situacao!=="coberto") m.push("→ "+meta.acao);
  return m.join("<br>");
}
function desenharLista(){
  var main = document.getElementById("conteudo");
  var linhas = estado.linhas.filter(passaFiltro);
  if(!linhas.length){
    var v = document.createElement("div"); v.className = "vazio";
    v.innerHTML = estado.filtroSit==="pendencias"
      ? "<b>Nenhuma pendência de guia ✔</b>Todas as consultas do período estão cobertas ou já foram tratadas."
      : "Nada aqui com esses filtros.";
    main.appendChild(v); return;
  }
  var porDia = {};
  linhas.forEach(function(l){ (porDia[l.data] = porDia[l.data] || []).push(l); });
  Object.keys(porDia).sort().forEach(function(dia){
    var g = document.createElement("section"); g.className = "grupo";
    var ex = porDia[dia][0];
    g.innerHTML = '<h2>'+escapa(ex.dia_semana)+' · '+escapa(ex.data_fmt)+
                  ' <span class="cont">'+porDia[dia].length+' consulta(s)</span></h2>';
    porDia[dia].forEach(function(l){ g.appendChild(cardDe(l)); });
    main.appendChild(g);
  });
}
function cardDe(l){
  var meta = SIT[l.situacao] || {rot:l.situacao, cls:"sinfo", g:"ginfo", acao:""};
  var tratada = l.tratamento==="resolvido" || l.tratamento==="desmarcado";
  var card = document.createElement("article");
  card.className = "card "+meta.g+(tratada?" tratada":"");
  var cel = primeiroCelular(l.celulares_raw, l.telefones_raw);

  card.innerHTML =
    '<div class="hora">'+escapa(l.horario)+'</div>'+
    '<div class="quem">'+
      '<div class="paciente">'+escapa(l.paciente)+'</div>'+
      '<div class="meta"><span class="esp">'+escapa(l.especialidade)+'</span> · '+escapa(l.profissional||"—")+
      ' · '+escapa(l.convenio||("convênio "+l.convenio_id))+' · <span title="status do agendamento">'+escapa(l.status)+'</span></div>'+
    '</div>'+
    '<div class="sit '+meta.cls+'"><span class="rotulo">'+escapa(meta.rot)+'</span>'+
      '<div class="detalhe">'+detalheDe(l)+'</div></div>';

  var acoes = document.createElement("div"); acoes.className = "acoes";
  if(cel){
    var wa = document.createElement("a");
    wa.className = "fone"; wa.target = "_blank"; wa.rel = "noopener";
    wa.href = "https://wa.me/"+cel;
    wa.innerHTML = "🟢 "+escapa(foneBonito(cel));
    wa.title = "Abrir conversa no WhatsApp";
    acoes.appendChild(wa);
  } else {
    var sf = document.createElement("span"); sf.className="fone"; sf.textContent = "📵 sem celular";
    acoes.appendChild(sf);
  }
  var sel = document.createElement("select");
  sel.setAttribute("aria-label","Tratamento");
  TRATAMENTOS.forEach(function(t){
    var o = document.createElement("option"); o.value = t[0]; o.textContent = t[1];
    if((l.tratamento||"pendente")===t[0]) o.selected = true;
    sel.appendChild(o);
  });
  sel.className = "trat-"+(l.tratamento||"pendente");
  var nota = document.createElement("input");
  nota.className = "nota"; nota.placeholder = "Anotar (protocolo, com quem falou…)";
  nota.value = l.nota || "";
  var salvo = document.createElement("span"); salvo.className = "salvo"; salvo.textContent = "salvo ✔";
  var autora = document.createElement("span"); autora.className = "autora-tag";
  if(l.autora_nota) autora.textContent = "por "+l.autora_nota;

  function persistir(){
    salvo.textContent = "salvando…"; salvo.classList.add("mostra");
    salvarNota(l.agendamento_id, sel.value, nota.value.trim(), function(okp){
      salvo.textContent = okp ? "salvo ✔" : "erro ao salvar ✖";
      salvo.style.color = okp ? "var(--ok)" : "var(--critico)";
      sel.className = "trat-"+sel.value;
      if(okp){ setTimeout(function(){ salvo.classList.remove("mostra"); }, 1600); desenhar(); }
    });
  }
  sel.addEventListener("change", persistir);
  nota.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ nota.blur(); } });
  nota.addEventListener("blur", function(){ if(nota.value.trim() !== (l.nota||"")) persistir(); });

  acoes.appendChild(sel); acoes.appendChild(nota); acoes.appendChild(salvo); acoes.appendChild(autora);
  card.appendChild(acoes);
  return card;
}

/* ═══ fila de reconferência: tela ═══ */
function desenharFila(){
  var main = document.getElementById("conteudo");
  main.innerHTML = "";

  var topo = document.createElement("div"); topo.className = "fila-topo";
  topo.innerHTML =
    '<h2>🔁 Renovações — reconferir no SGU</h2>'+
    '<p>A Unimed renovou a validade (senha ou carteirinha) de uma guia que <b>já existe</b>? '+
    'Digite o número: o robô abre a guia no SGU, confere as duas datas e atualiza o sistema sozinho. '+
    'O resultado aparece aqui embaixo — leu, tira com o ✕.</p>'+
    '<div class="fila-form">'+
      '<input id="filaNum" inputmode="numeric" autocomplete="off" placeholder="Número da guia (só números)">'+
      '<button class="btn" id="filaEnviar">Mandar pro robô</button>'+
    '</div>'+
    '<div class="fila-aviso" id="filaAviso"></div>';
  main.appendChild(topo);

  var campo = topo.querySelector("#filaNum");
  campo.value = estado.filaDraft || "";
  campo.addEventListener("input", function(){ estado.filaDraft = campo.value; });
  campo.addEventListener("keydown", function(ev){ if(ev.key === "Enter") enviarFila(); });
  topo.querySelector("#filaEnviar").addEventListener("click", enviarFila);
  if(estado.filaDraft){
    campo.focus();
    try{ campo.setSelectionRange(campo.value.length, campo.value.length); }catch(e){}
  }

  if(estado.fila === null){
    var c = document.createElement("div"); c.className = "carregando";
    c.textContent = "Buscando a fila no banco…";
    main.appendChild(c); return;
  }
  if(estado.filaErro){
    var er = document.createElement("div"); er.className = "erro";
    er.innerHTML = 'Não consegui ler a fila <span class="mono">pre_guias_reconferir</span>.<br>' + escapa(estado.filaErro);
    main.appendChild(er); return;
  }
  if(!estado.fila.length){
    var v = document.createElement("div"); v.className = "vazio";
    v.innerHTML = "<b>Nada na fila ✔</b>Renovou uma guia com a Unimed? Digite o número acima que o robô confere no SGU.";
    main.appendChild(v); return;
  }

  var linhas = estado.fila.slice().sort(function(a, b){
    var fa = FILA_FINAIS.indexOf(a.situacao) >= 0 ? 1 : 0;
    var fb = FILA_FINAIS.indexOf(b.situacao) >= 0 ? 1 : 0;
    if(fa !== fb) return fa - fb;                    /* pendentes primeiro */
    return a.criado_em < b.criado_em ? 1 : -1;       /* mais novas em cima */
  });
  linhas.forEach(function(l){ main.appendChild(fcardDe(l)); });
}
function fcardDe(l){
  var meta = SIT_FILA[l.situacao] || {rot:l.situacao, cls:"sinfo", g:"ginfo"};
  var card = document.createElement("article");
  card.className = "fcard " + meta.g;

  var esq = document.createElement("div");
  var quando = "por " + escapa(l.autora || "—") + " · " + fmtQuando(l.criado_em) +
               (l.conferida_em ? " · conferida " + fmtQuando(l.conferida_em) : "");
  esq.innerHTML =
    '<div class="fnum">guia ' + escapa(l.numero_guia) +
      (l.paciente ? ' · <span class="fpac">' + escapa(l.paciente) + '</span>' : '') + '</div>'+
    '<div class="fmeta">' + quando + '</div>'+
    '<div class="fsit ' + meta.cls + '"><span class="rotulo">' + escapa(meta.rot) + '</span></div>'+
    (l.detalhe ? '<div class="fdet">' + escapa(l.detalhe) + '</div>' : '');
  card.appendChild(esq);

  var dir = document.createElement("div");
  if(FILA_FINAIS.indexOf(l.situacao) >= 0){
    var x = document.createElement("button");
    x.className = "fx"; x.textContent = "✕"; x.title = "Li — pode tirar da tela";
    x.setAttribute("aria-label","Dispensar este aviso");
    x.onclick = function(){ dispensarFila(l.id); };
    dir.appendChild(x);
  } else {
    dir.innerHTML = '<span class="fespera" title="O robô ainda vai olhar">⏳</span>';
  }
  card.appendChild(dir);
  return card;
}

/* ═══ visão do dono (v1.1) ═══ */
function abrirAdmin(){
  if(!CFG.dono){ alert("Esta área é do administrador."); return; }
  estado.tela = "agenda"; desligarPollFila();
  desenharAdmin();
}
function buscarAdmin(){
  var q = function(rota){ return fetch(CFG.url + rota, {headers: cab()})
    .then(function(r){ if(!r.ok) throw new Error(rota+" → HTTP "+r.status); return r.json(); }); };
  return Promise.all([
    q("/rest/v1/pre_adm_reincidencias?select=*"),
    q("/rest/v1/pre_adm_atendidas_sem_guia?select=*"),
    q("/rest/v1/pre_agenda_notas?select=agendamento_id,tratamento,autora,atualizado_em")
  ]);
}
function resumoTexto(P, reinc, atend, notas7){
  var l = [];
  l.push("📊 GUIAS DA AGENDA — resumo de " + new Date().toLocaleDateString("pt-BR") +
         " " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
  l.push("Pendências abertas: " + P.pend + " (críticas: " + P.crit + ") · hoje: " + P.hoje + " · amanhã: " + P.amanha);
  l.push("Por terapia: psico " + (P.porEsp.psicologia||0) + " · ABA " + (P.porEsp.aba||0) + " · nutrição " + (P.porEsp.nutricao||0));
  l.push("⚠️ Consultaram SEM guia (últimos 30d): " + atend.length +
         (atend.length ? " → " + atend.slice(0,5).map(function(a){return a.paciente.split(" ")[0]+" "+a.data_fmt;}).join(", ") + (atend.length>5?"…":"") : ""));
  l.push("🔁 Reincidências (disseram que resolveu, não resolveu): " + reinc.length +
         (reinc.length ? " → " + reinc.slice(0,5).map(function(r){return r.paciente.split(" ")[0]+" ("+(r.autora_nota||"?")+")";}).join(", ") + (reinc.length>5?"…":"") : ""));
  var porSec = {};
  notas7.forEach(function(n){ if(n.autora) porSec[n.autora] = (porSec[n.autora]||0)+1; });
  var rk = Object.keys(porSec).sort(function(a,b){return porSec[b]-porSec[a];})
    .map(function(k){return k+" "+porSec[k];}).join(" · ");
  l.push("✍️ Tratamentos (7 dias): " + (rk || "nenhum"));
  return l.join("\n");
}
function desenharAdmin(){
  var main = document.getElementById("conteudo");
  main.innerHTML = '<div class="carregando">Montando os relatórios do dono…</div>';
  buscarAdmin().then(function(res){
    var reinc = res[0], atendTudo = res[1], notas = res[2];
    var atend = atendTudo.filter(function(a){ return a.dias_atras <= 30; });
    var corte7 = Date.now() - 7*24*3600*1000;
    var notas7 = notas.filter(function(n){ return new Date(n.atualizado_em).getTime() >= corte7; });

    var P = { pend:0, crit:0, hoje:0, amanha:0, porEsp:{} };
    var hojeISO = null, diasOrd = diasUnicos().map(function(d){return d.data;});
    if(diasOrd.length){ hojeISO = diasOrd[0]; }
    estado.linhas.forEach(function(l){
      if(!ehPendencia(l)) return;
      P.pend++;
      if(l.gravidade === 0) P.crit++;
      P.porEsp[l.especialidade] = (P.porEsp[l.especialidade]||0)+1;
      if(l.dias_ate === 0) P.hoje++;
      if(l.dias_ate === 1) P.amanha++;
    });

    var h = '<div class="adm-titulo"><h2>👑 Visão do dono</h2>'+
            '<button class="btn" id="admVoltar">← Voltar ao painel</button>'+
            '<button class="btn" id="admCopiar" style="background:var(--ok)">📋 Copiar resumo</button></div>';

    h += '<div class="adm-cards">'+
      '<div class="adm-card '+(P.pend?'vermelho':'verde')+'"><div class="num">'+P.pend+'</div><div class="rot">pendências abertas</div></div>'+
      '<div class="adm-card '+(P.crit?'vermelho':'verde')+'"><div class="num">'+P.crit+'</div><div class="rot">críticas (sem guia)</div></div>'+
      '<div class="adm-card"><div class="num">'+P.hoje+' / '+P.amanha+'</div><div class="rot">hoje / amanhã</div></div>'+
      '<div class="adm-card '+(atend.length?'vermelho':'verde')+'"><div class="num">'+atend.length+'</div><div class="rot">consultaram sem guia · 30d</div></div>'+
      '<div class="adm-card '+(reinc.length?'ambar':'verde')+'"><div class="num">'+reinc.length+'</div><div class="rot">reincidências</div></div>'+
      '<div class="adm-card"><div class="num">'+(P.porEsp.psicologia||0)+'·'+(P.porEsp.aba||0)+'·'+(P.porEsp.nutricao||0)+'</div><div class="rot">psico · aba · nutrição</div></div>'+
    '</div>';

    h += '<div class="adm-sec">🔁 Falou que resolveu — e não resolveu <small>(tratado há mais de 2h e o problema continua)</small></div>';
    if(!reinc.length){ h += '<div class="adm-vazio">Nenhuma reincidência. As meninas estão fechando o que abrem ✔</div>'; }
    else {
      h += '<table class="adm"><tr><th>Consulta</th><th>Paciente</th><th>Problema atual</th><th>Disse</th><th>Quem</th><th>Há quanto</th><th>Nota</th></tr>';
      reinc.forEach(function(r){
        var m = SIT[r.situacao]||{rot:r.situacao,cls:"s1"};
        h += '<tr><td>'+escapa(r.data_fmt)+' '+escapa(r.horario)+'</td><td><b>'+escapa(r.paciente)+'</b><br><small>'+escapa(r.especialidade)+'</small></td>'+
             '<td><span class="tag-sit tag-'+(m.cls==="s0"?"s0":"s1")+'">'+escapa(m.rot)+'</span></td>'+
             '<td>'+escapa(r.tratamento==="resolvido"?"Resolvido":"Guia solicitada")+'</td>'+
             '<td>'+escapa(r.autora_nota||"—")+'</td><td>'+r.horas_desde_tratamento+'h</td>'+
             '<td><small>'+escapa(r.nota||"")+'</small></td></tr>';
      });
      h += '</table>';
    }

    h += '<div class="adm-sec">🚨 Paciente consultou SEM guia <small>(últimos 30 dias · a régua não achou guia cobrindo a data · ✔ = o faturamento também marcou)</small></div>';
    if(!atend.length){ h += '<div class="adm-vazio">Nenhuma consulta sem guia no período ✔</div>'; }
    else {
      h += '<table class="adm"><tr><th>Data</th><th>Paciente</th><th>Terapia</th><th>Profissional</th><th>Status</th><th>Faturamento</th></tr>';
      atend.forEach(function(a){
        h += '<tr><td>'+escapa(a.data_fmt)+' '+escapa(a.horario)+'<br><small>'+a.dias_atras+'d atrás</small></td>'+
             '<td><b>'+escapa(a.paciente)+'</b></td><td>'+escapa(a.especialidade)+'</td>'+
             '<td>'+escapa(a.profissional||"—")+'</td><td>'+escapa(a.status)+'</td>'+
             '<td>'+(a.f0_confirma?'<span class="tag-sit tag-s0">✔ sem_guia no f0</span>':'<small>só pela régua</small>')+'</td></tr>';
      });
      h += '</table>';
    }

    var porSec = {};
    notas7.forEach(function(n){ if(n.autora) porSec[n.autora] = (porSec[n.autora]||0)+1; });
    h += '<div class="adm-sec">✍️ Tratamentos registrados <small>(últimos 7 dias, por secretária)</small></div>';
    var ks = Object.keys(porSec);
    if(!ks.length){ h += '<div class="adm-vazio" style="background:var(--info-fundo);color:var(--info)">Ninguém registrou tratamento nos últimos 7 dias.</div>'; }
    else {
      h += '<table class="adm"><tr><th>Secretária</th><th>Tratamentos</th></tr>';
      ks.sort(function(a,b){return porSec[b]-porSec[a];}).forEach(function(k){
        h += '<tr><td><b>'+escapa(k)+'</b></td><td>'+porSec[k]+'</td></tr>';
      });
      h += '</table>';
    }

    main.innerHTML = h;
    document.getElementById("admVoltar").onclick = desenhar;
    document.getElementById("admCopiar").onclick = function(){
      var txt = resumoTexto(P, reinc, atend, notas7);
      var fim = function(okc){ alert(okc ? "Resumo copiado — é só colar no WhatsApp." : txt); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){fim(true);}, function(){fim(false);});
      } else { fim(false); }
    };
  }).catch(function(e){
    main.innerHTML = '<div class="erro">Não consegui montar a visão do dono.<br>'+escapa(e.message)+
      '<br><small>As views pre_adm_* existem? Rode o 08_SQL_PRE_E_CONF.sql v1.1.</small></div>';
  });
}

/* ═══ login ═══ */
function telaLogin(erro){
  var main = document.getElementById("conteudo");
  document.getElementById("cabecalho").hidden = true;
  var opcoes = USUARIOS.map(function(u){
    return '<option value="'+escapa(u.nome)+'">'+escapa(u.nome)+'</option>';
  }).join("");
  main.innerHTML =
    '<div class="setup"><h2>Guias da Agenda</h2>'+
    '<p>Escolha seu nome pra entrar. Suas anotações no painel ficam assinadas com ele.</p>'+
    (erro ? '<div class="login-erro">'+escapa(erro)+'</div>' : '')+
    '<label>Quem é você</label><select id="lgNome">'+opcoes+'</select>'+
    '<div id="lgSenhaBox" style="display:none"><label>Senha</label>'+
    '<input id="lgSenha" type="password" placeholder="••••••" autocomplete="current-password"></div>'+
    '<button class="btn" id="lgEntrar">Entrar</button></div>';

  var selNome = document.getElementById("lgNome");
  var campo = document.getElementById("lgSenha");
  var salvo = lembrado("pga_autora");
  if(salvo && USUARIOS.some(function(u){ return u.nome === salvo; })) selNome.value = salvo;

  function acharUsuario(){ return USUARIOS.filter(function(x){ return x.nome === selNome.value; })[0]; }
  function ajustaSenha(){   // só mostra o campo se ESSA pessoa tiver senha definida
    var u = acharUsuario();
    document.getElementById("lgSenhaBox").style.display = (u && u.senha) ? "" : "none";
  }
  ajustaSenha();
  selNome.addEventListener("change", ajustaSenha);
  campo.addEventListener("keydown", function(ev){ if(ev.key === "Enter") tentar(); });
  document.getElementById("lgEntrar").onclick = tentar;

  function tentar(){
    var u = acharUsuario();
    if(!u){ telaLogin("Escolha um nome da lista."); return; }
    if(u.senha && campo.value !== u.senha){ telaLogin("Senha incorreta. Tente de novo."); return; }
    CFG.autora = u.nome;
    CFG.dono = !!u.dono;
    lembrar("pga_autora", CFG.autora);
    lembrar("pga_dono", CFG.dono ? "1" : "0");
    iniciar();
  }
}
function sair(){
  esquecer("pga_dono");
  CFG.dono = false;
  desligarPollFila();
  estado.tela = "agenda";
  telaLogin();
}
function iniciar(){
  if(!CFG.key){
    document.getElementById("conteudo").innerHTML =
      '<div class="erro">O painel não foi publicado com a chave do banco.<br>'+
      'Abra o arquivo e preencha <span class="mono">SUPABASE_KEY</span> no topo.</div>';
    return;
  }
  document.getElementById("cabecalho").hidden = false;
  document.getElementById("btnAdmin").style.display = CFG.dono ? "" : "none";
  document.getElementById("quemSou").textContent = CFG.autora;
  carregar();
  carregarFila();
  if(!window._pgaTimer) window._pgaTimer = setInterval(function(){ carregar(); carregarFila(); }, 5*60*1000);  // auto-atualiza
}
document.getElementById("btnAtualizar").addEventListener("click", function(){ carregar(); carregarFila(); });
document.getElementById("btnAdmin").addEventListener("click", abrirAdmin);
document.getElementById("btnSair").addEventListener("click", sair);
document.getElementById("btnFila").addEventListener("click", function(){
  if(estado.tela === "fila"){
    estado.tela = "agenda"; desligarPollFila(); desenhar();
  } else {
    estado.tela = "fila"; ligarPollFila(); desenhar(); carregarFila();
  }
});
document.getElementById("busca").addEventListener("input", function(e){
  estado.busca = e.target.value.trim().toLowerCase(); desenhar();
});

telaLogin();   // o painel sempre começa pelo login
</script>
